# safeAI framework: seven levels of "Is it safe?"
#
# This file is the single source of truth for both the command-line tool and the
# browser tool. Edit it (via pull request) to add or refine controls.
#
# Schema (validated by `safeai framework-check` and by the test suite):
#   guarantee_types   the kinds of guarantee a control can provide, strongest first
#   verbs             the four groups the seven levels fall into
#   layers            the seven levels
#   controls          the individual, assessable controls
#
# Control fields:
#   id             "L<layer>.<nn>", unique and stable (never reuse an id)
#   layer          layer id
#   title          short noun phrase
#   question       a yes/no style self-assessment question, written to be answerable
#                  by someone who is not a technologist
#   audience       who it applies to: organization (uses AI tools), product (builds AI
#                  features or integrations), or both
#   max_guarantee  the strongest realistic guarantee for this control:
#                  structural | procedural | guided
#   severity       critical | high | medium (how bad a gap is)
#   effort         low | medium | high (rough cost to close a gap)
#   quick_win      true if a typical organization can close the gap in weeks
#   steps          concrete actions that close the gap
#   evidence       what an auditor could look at to confirm the answer
#   floor          (optional) true if the control is part of the human-dignity floor.
#                  A floor control must reach at least procedural, or the overall rating
#                  is held at Developing. See docs/floor.md.
#   floor_principle  one plain sentence naming what the floor control protects
#                  (required when floor is true)

version: "0.1.0"

guarantee_types:
  structural:
    rank: 3
    label: Structural
    meaning: Enforced in code or configuration. It cannot happen, whatever the AI does or is told.
    example: A phone number is masked by the server before the AI ever receives it.
    fails_by: Misconfiguration, or rules too narrow to catch what matters.
  procedural:
    rank: 2
    label: Procedural
    meaning: It cannot happen without a named person's approval or a recorded process.
    example: Write access stays off until an administrator signs a recorded decision to enable it.
    fails_by: Rubber-stamping, approval fatigue, approvers who lack context.
  guided:
    rank: 1
    label: Guided
    meaning: The AI or its users are told what to do and usually comply. Nothing ensures it.
    example: Staff are told not to paste personal data into a chatbot.
    fails_by: Drift, misreading, prompt injection, model updates, forgetfulness.
  none:
    rank: 0
    label: None
    meaning: No control exists yet.
    example: ""
    fails_by: ""

verbs:
  SEE:
    label: What the AI can SEE
    summary: Data, and who handles it.
  DO:
    label: What the AI can DO
    summary: Actions, authority, and protection of people who could be harmed.
  SAY:
    label: What the AI can SAY
    summary: Words spoken in your name, and the line between machine and person.
  ANSWER:
    label: Who ANSWERS for it
    summary: Responsibility, records, and the ability to stop it.

layers:
  - id: L1
    number: 1
    verb: SEE
    name: Data protection
    tagline: Your people's data stays protected.
    question: "Can the AI see personal or sensitive information? Could it leak?"
    harm: Exposure of personal, financial, health, case, or contact data; legal and reputational damage.
  - id: L2
    number: 2
    verb: SEE
    name: Vendor and model trust
    tagline: Your data is not used to train AI, and you control the account.
    question: "Which AI company and model? Do they keep or train on our data?"
    harm: Constituent data retained or reused outside your control.
  - id: L3
    number: 3
    verb: DO
    name: Delegation and authority
    tagline: It does only what you grant, and it stops for a person.
    question: "Can it change records, spend money, or message people on its own?"
    harm: Unauthorized changes, mass messages, and actions triggered by hidden instructions in documents.
  - id: L4
    number: 4
    verb: DO
    name: Protection of the vulnerable
    tagline: Children and people in crisis are protected by rules no setting can lower.
    question: "What about children, survivors, clients in crisis, and people who depend on us?"
    harm: Harm to minors or vulnerable people; safeguarding failures; unfair decisions that the affected people cannot see or contest.
  - id: L5
    number: 5
    verb: SAY
    name: Mission and values fidelity
    tagline: It is held to what your organization stands for.
    question: "Will it say something that contradicts our mission, commitments, or facts?"
    harm: Misstatements made in your name; erosion of the trust your mission depends on.
  - id: L6
    number: 6
    verb: SAY
    name: The human boundary
    tagline: It represents; it never impersonates or replaces a person.
    question: "Will it pretend to be a person, or stand in for someone whose role needs a human?"
    harm: AI presented as a staff member or professional; care and judgment reduced to automation.
  - id: L7
    number: 7
    verb: ANSWER
    name: Accountability and governance
    tagline: You set the rules, and you can see and stop every decision.
    question: "Who is responsible? Can we see what it did, and can we stop it?"
    harm: Nobody can explain an action afterwards; the organization cannot show due care.

controls:
  # ------------------------------------------------------------------ L1 Data
  - id: L1.01
    layer: L1
    title: Data inventory and classification
    question: Do you know which data the AI systems in scope can reach, and is that data classified by sensitivity?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: low
    quick_win: true
    steps:
      - List every system the AI can read from or write to (databases, email, file shares, CRM, case systems).
      - Classify the data in each as public, internal, confidential, or restricted.
      - Record the classification where the people configuring AI access will see it.
    evidence: [Data inventory or register, Classification scheme]

  - id: L1.02
    layer: L1
    title: AI inherits the user's own permissions
    question: Does the AI act with the signed-in person's own access rights, so it can never see more than that person can?
    audience: [organization, product]
    max_guarantee: structural
    severity: critical
    effort: medium
    quick_win: false
    steps:
      - Connect AI tools through each person's own identity (for example OAuth or single sign-on), not a shared super-account.
      - Remove any shared service accounts with broad read access.
      - Test with a low-privilege user and confirm the AI cannot reach restricted data.
    evidence: [Integration configuration, Result of a low-privilege access test]

  - id: L1.03
    layer: L1
    title: Restricted data is blocked from AI paths by default
    question: Are your most sensitive data sets (credentials, payment details, case files) technically unreachable by the AI unless someone deliberately opens them?
    audience: [organization, product]
    max_guarantee: structural
    severity: critical
    effort: low
    quick_win: true
    steps:
      - Maintain a block list of tables, folders, or fields the AI can never query.
      - Start the list with payment instruments, credentials, system configuration, and message content.
      - Make removing an item from the block list a recorded decision.
    evidence: [Block list configuration, Change history for the block list]

  - id: L1.04
    layer: L1
    title: Personal data is masked before it reaches the model
    question: Are sensitive fields (email, phone, birth date, ID numbers, addresses) masked or removed in code before the AI receives them?
    audience: [organization, product]
    max_guarantee: structural
    severity: critical
    effort: medium
    quick_win: false
    steps:
      - Put a masking layer between your data and the AI so masking cannot be bypassed with a clever prompt.
      - Define the list of masked fields and review it each quarter.
      - Verify with test records that real values never appear in what is sent to the model.
    evidence: [Masking rules, Test results showing masked output]

  - id: L1.05
    layer: L1
    title: Personal data inside free text is detected
    question: Do you detect and mask personal data typed into notes, comments, or message fields, not only data in labeled fields?
    audience: [organization, product]
    max_guarantee: structural
    severity: high
    effort: medium
    quick_win: false
    steps:
      - Test whether a phone number or disclosure typed into a notes field reaches the AI unmasked.
      - Add pattern-based detection (and, where warranted, entity recognition) for free-text fields.
      - Where detection is imperfect, block free-text fields on the most sensitive records instead.
    evidence: [Free-text test cases and results]

  - id: L1.06
    layer: L1
    title: Staff know what not to paste into AI tools
    question: Do staff and volunteers have clear, short guidance on what data must never be typed or pasted into an AI tool?
    audience: [organization]
    max_guarantee: guided
    severity: high
    effort: low
    quick_win: true
    steps:
      - Write a one-page do and do-not list with concrete examples from your own work.
      - Include it in onboarding and repeat it at least yearly.
      - Be honest in your own reporting that this control is guided, not enforced.
    evidence: [The guidance document, Training attendance]

  - id: L1.07
    layer: L1
    title: Pass-through handling and minimal retention
    question: Do your AI integrations avoid storing constituent records, and do they keep prompts, outputs, and logs only as long as needed?
    audience: [organization, product]
    max_guarantee: structural
    severity: high
    effort: medium
    quick_win: false
    steps:
      - Document what each AI integration stores, where, and for how long.
      - Set retention limits and automatic deletion for prompts, outputs, and caches.
      - Keep personal data out of logs, or mask it there as well.
    evidence: [Retention settings, Data flow diagram]

  - id: L1.08
    layer: L1
    title: Privacy obligations cover AI use
    question: Do your privacy notice, consent practices, and (where required) impact assessments cover the use of AI with personal data?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: medium
    quick_win: false
    steps:
      - Check which privacy laws and funder or regulator rules apply to you (verify with qualified legal advice).
      - Update your privacy notice to describe AI processing in plain language.
      - Complete a data protection impact assessment where your jurisdiction requires or recommends one.
    evidence: [Updated privacy notice, Impact assessment]

  # ------------------------------------------------------------------ L2 Vendor
  - id: L2.01
    layer: L2
    title: Vendor data terms reviewed
    question: "Have you read and recorded what each AI vendor does with your data: training, retention, human review, deletion?"
    audience: [organization, product]
    max_guarantee: procedural
    severity: critical
    effort: low
    quick_win: true
    steps:
      - For every AI vendor, record whether your data is used for training and for how long it is retained.
      - Note which account type the answer depends on. Consumer and business terms often differ.
      - Re-check whenever the vendor updates its terms.
    evidence: [Vendor review record with date and the terms reviewed]

  - id: L2.02
    layer: L2
    title: Organization-managed accounts, not personal logins
    question: Do staff use AI through accounts your organization manages, so you control seats, settings, and offboarding?
    audience: [organization]
    max_guarantee: structural
    severity: high
    effort: medium
    quick_win: false
    steps:
      - Provide approved AI tools on organization-managed accounts.
      - Use single sign-on where available, so removing a person removes their access.
      - Where you cannot technically block personal accounts, say plainly that this control is procedural or guided.
    evidence: [Account administration console, Offboarding checklist]

  - id: L2.03
    layer: L2
    title: Model and sub-processor inventory
    question: Can you say which AI model and which companies process your data, and where?
    audience: [organization, product]
    max_guarantee: procedural
    severity: medium
    effort: low
    quick_win: true
    steps:
      - Publish a one-page statement listing each model, vendor, sub-processor, and processing region.
      - Update it when you change model or vendor.
    evidence: [Model and sub-processor statement]

  - id: L2.04
    layer: L2
    title: Contracts and data processing terms
    question: Are there written agreements covering confidentiality, data processing, breach notification, and deletion on exit?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: medium
    quick_win: false
    steps:
      - Confirm a data processing agreement or equivalent exists for each vendor handling personal data.
      - Check breach-notification timing and deletion-on-exit commitments.
      - Ask a lawyer or your funder's compliance contact to review anything unusual.
    evidence: [Signed agreements]

  - id: L2.05
    layer: L2
    title: Vendor safety rules and values are known
    question: Do you know which safety rules and published values the underlying model brings, and have you told your leadership?
    audience: [organization, product]
    max_guarantee: procedural
    severity: medium
    effort: low
    quick_win: true
    steps:
      - Read the vendor's published usage policy and model documentation.
      - Tell leadership and, where relevant, constituents that your own rules sit on top of the vendor's, so nobody discovers a second, invisible value layer on their own.
    evidence: [Summary of vendor policies, Leadership briefing]

  - id: L2.06
    layer: L2
    title: Your own commitment on constituent data
    question: Have you made, and published, a commitment about what you yourself do with constituent data in AI contexts (no selling, no training, no pooling without consent)?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: low
    quick_win: true
    steps:
      - Decide and write down what you will never do with constituent data, whatever a vendor permits.
      - Publish it in plain language where constituents and partners can find it.
      - Hold yourself to it through your governance process (see L7).
    evidence: [Published data commitment]

  - id: L2.07
    layer: L2
    title: Environmental and labor due diligence
    question: Have you considered, and recorded, what the vendor discloses about energy and water use and the working conditions of the people who label data and moderate content?
    audience: [organization, product]
    max_guarantee: guided
    severity: medium
    effort: low
    quick_win: false
    steps:
      - Ask each vendor for its published environmental and labor disclosures.
      - Record what you found and how it informed your choice.
    evidence: [Vendor disclosures reviewed]

  - id: L2.08
    layer: L2
    title: Re-assessment on vendor or model change
    question: Do you re-run this assessment, and your behavioral tests, when a vendor changes its terms, or a model is swapped or updated?
    audience: [organization, product]
    max_guarantee: procedural
    severity: medium
    effort: low
    quick_win: false
    steps:
      - Subscribe to vendor change notices.
      - Make a model or terms change a trigger in your change-control process (see L7.14).
    evidence: [Change log showing re-assessment]

  # ------------------------------------------------------------------ L3 Delegation
  - id: L3.01
    layer: L3
    title: Allow-list of AI actions, deny by default
    question: Is every action the AI can take (read, create, update, send, delete) explicitly granted per role, with everything else denied?
    audience: [organization, product]
    max_guarantee: structural
    severity: critical
    effort: medium
    quick_win: false
    steps:
      - List the action classes your AI integrations can perform.
      - Grant each explicitly to specific roles. Treat anything unlisted as denied.
      - Review grants at least twice a year.
    evidence: [Grant table, Configuration showing deny-by-default]

  - id: L3.02
    layer: L3
    title: Write and send capabilities are off until a decision is recorded
    question: Is the ability to change records or send messages switched off by default, and turned on only through a recorded decision?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: low
    quick_win: true
    steps:
      - Start every deployment read-only.
      - Require a short written decision, with named approver and impact assessment (see L7.10), before enabling write or send.
    evidence: [Decision record for each enabled capability]

  - id: L3.03
    layer: L3
    title: Draft versus commit
    question: Can the AI draft or stage a change or message, with a person required to commit or send it, unless a grant says otherwise?
    audience: [organization, product]
    max_guarantee: structural
    severity: critical
    effort: medium
    quick_win: false
    steps:
      - Split each write or send action into a staged step and a commit step.
      - Make the commit step a human action in the tool itself, not a convention.
      - Show approvers what will change, not only the AI's summary of it.
    evidence: [Workflow showing a human commit step]

  - id: L3.04
    layer: L3
    floor: true
    floor_principle: "Serious or irreversible decisions stay with people."
    title: Irreversible actions are never autonomous
    question: Do deletions, bulk messages, payments, and changes to protected records always need a human commit, whatever the grant?
    audience: [organization, product]
    max_guarantee: structural
    severity: critical
    effort: medium
    quick_win: false
    steps:
      - "Define irreversible: anything that cannot be fully undone or that reaches many people."
      - Enforce a human commit for those actions in code, regardless of role or grant.
      - Hold mass updates above a set threshold for approval.
    evidence: [Rule configuration, Tests attempting each irreversible action]

  - id: L3.05
    layer: L3
    title: Every grant has a named signer
    question: For each thing the AI is allowed to do, is there a named person who signed off on that grant?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: low
    quick_win: true
    steps:
      - Record who authorized each grant, when, and under which policy version.
      - The signer is a person in a defined role, never the AI and never the vendor.
    evidence: [Grant records with signer and date]

  - id: L3.06
    layer: L3
    title: Escalation is designed, not an error path
    question: Is there a defined point at which the AI must stop and hand a decision to a person, with a record of what was asked and why it stopped?
    audience: [organization, product]
    max_guarantee: procedural
    severity: medium
    effort: medium
    quick_win: false
    steps:
      - "Define the conditions that require a person: sensitive topics, uncertainty, conflict with a firm rule, high impact."
      - When a firm rule conflicts with an instruction, hold and surface the conflict to the requester. Never silently comply or silently refuse.
      - "Record each handoff: the request, the proposed action, the rule, the risk."
    evidence: [Escalation rules, Sample handoff records]

  - id: L3.07
    layer: L3
    title: Prompt-injection containment
    question: Is content from outside (uploads, inbound email, web pages, form submissions) treated as untrusted, with stricter limits on what the AI may do after reading it?
    audience: [organization, product]
    max_guarantee: structural
    severity: critical
    effort: high
    quick_win: false
    steps:
      - Tag any action proposed while the AI was reading external content with a provenance flag.
      - Apply stricter rules, or a mandatory human commit, to flagged actions.
      - Test with documents that contain hidden instructions (see L7.13).
    evidence: [Provenance flag implementation, Red-team results]

  - id: L3.08
    layer: L3
    title: Volume and rate limits
    question: Are there hard caps on recipients per message, records changed per run, and spend per period?
    audience: [organization, product]
    max_guarantee: structural
    severity: high
    effort: low
    quick_win: true
    steps:
      - Set conservative defaults for recipients per send, records per update, and API or spend limits.
      - Raising a cap is a recorded decision.
    evidence: [Configured limits]

  - id: L3.09
    layer: L3
    title: Policy travels with delegated work
    question: When one AI agent or tool hands work to another, do your constraints travel with it?
    audience: [product]
    max_guarantee: structural
    severity: medium
    effort: high
    quick_win: false
    steps:
      - Pass the originating role, grant, and policy version with every sub-agent or tool call.
      - Reject calls that arrive without that context.
    evidence: [Architecture description, Tests with stripped context]

  # ------------------------------------------------------------------ L4 Vulnerable
  - id: L4.01
    layer: L4
    title: Protected people and records are defined
    question: Have you written down who counts as a protected person (minors, vulnerable adults, survivors, clients in crisis) and which records concern them?
    audience: [organization, product]
    max_guarantee: procedural
    severity: critical
    effort: low
    quick_win: true
    steps:
      - Use your safeguarding policy, funder requirements, and applicable law to define the groups.
      - List the systems, tables, folders, and fields that hold their information.
      - Have your safeguarding lead review the list.
    evidence: [Protected persons definition, Protected records list]

  - id: L4.02
    layer: L4
    title: Protected records blocked or masked by default
    question: Are safeguarding, case, counseling, health, and similar records blocked or masked from AI paths unless a named person has opened them?
    audience: [organization, product]
    max_guarantee: structural
    severity: critical
    effort: low
    quick_win: true
    steps:
      - Add the records from L4.01 to your block or mask list (see L1.03 and L1.04).
      - Cover vulnerable adults with the same protections as minors.
    evidence: [Block list showing protected records]

  - id: L4.03
    layer: L4
    floor: true
    floor_principle: "Children's images and identifying details are kept off AI paths."
    title: Images and identifying details of minors stay off AI paths
    question: Are photos and identifying details of children unreachable by AI, and is AI generation or editing of images of identifiable children prohibited?
    audience: [organization, product]
    max_guarantee: structural
    severity: critical
    effort: medium
    quick_win: false
    steps:
      - Exclude photo and file fields for minors from every AI integration.
      - Mask age group, grade, and guardian links by default.
      - Check which file and image tools your AI integrations expose, and disable the ones that reach these files.
    evidence: [File tool configuration, Test results]

  - id: L4.04
    layer: L4
    floor: true
    floor_principle: "The AI does not contact children without the required adults."
    title: No AI-initiated contact with minors without required adults
    question: Is it impossible for the AI to send a message to a minor without a parent, guardian, or other required adult included, where your policy requires it?
    audience: [organization, product]
    max_guarantee: structural
    severity: critical
    effort: medium
    quick_win: false
    steps:
      - Add a recipient rule on every send path that checks for minors and required copies.
      - Hold, and do not send, any message that fails the rule.
    evidence: [Recipient rule, Test messages]

  - id: L4.05
    layer: L4
    title: Abuse, self-harm, and crisis content goes to a person
    question: Is content about abuse, self-harm, or immediate danger never auto-sent, and routed to a named person and your reporting workflow?
    audience: [organization, product]
    max_guarantee: procedural
    severity: critical
    effort: medium
    quick_win: false
    steps:
      - Identify the people and procedures that handle disclosures, and the reporting duties that apply to you (verify with your safeguarding lead and legal counsel).
      - Route detected content to that person. Hold it instead of sending.
      - Test the route with seeded examples.
    evidence: [Escalation procedure, Test results]

  - id: L4.06
    layer: L4
    title: Urgent need is never queued behind review
    question: Can a request involving urgent human need or danger skip any approval or review queue meant for routine content?
    audience: [organization, product]
    max_guarantee: structural
    severity: high
    effort: low
    quick_win: false
    steps:
      - Give urgent-need items a priority path that reaches a person immediately.
      - Make it a rule that review of tone, mission, or policy never delays help.
    evidence: [Priority rule, Test showing immediate routing]

  - id: L4.07
    layer: L4
    floor: true
    floor_principle: "People, not algorithms, decide who receives help."
    title: AI informs; people decide eligibility and priority
    question: When AI contributes to decisions about aid, services, or care priority, is a named person always the decider, and is their decision recorded?
    audience: [organization, product]
    max_guarantee: procedural
    severity: critical
    effort: medium
    quick_win: false
    steps:
      - "List decisions that affect a person's access to help: eligibility, priority, referral, grants."
      - Require a named person to decide each, with the AI's contribution shown as input only.
      - Record the decision and the person who made it.
    evidence: [Decision records]

  - id: L4.08
    layer: L4
    title: Fairness checks on AI rankings
    question: Before AI rankings or recommendations are used (care queues, aid, outreach), do you check that they do not systematically disadvantage a group?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: high
    quick_win: false
    steps:
      - Choose the groups relevant to your work and the data you can lawfully use to check them.
      - Compare outcomes across groups on a sample before go-live, then periodically.
      - Document what you checked and what you changed.
    evidence: [Fairness check report]

  - id: L4.09
    layer: L4
    floor: true
    floor_principle: "How the AI measures and ranks people is visible, not hidden."
    title: AI scores and classifications of people are visible
    question: Is any AI-produced score, label, or classification of a person disclosed to staff and explainable to them?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: medium
    quick_win: false
    steps:
      - Inventory every place an AI assigns a score, tag, risk level, or category to a person.
      - Show it to staff with the factors behind it.
      - Retire any that cannot be explained.
    evidence: [Inventory of AI classifications, Screenshots of explanations]

  - id: L4.10
    layer: L4
    title: No appeals that exploit vulnerability
    question: Is AI prevented from tailoring fundraising, engagement, or persuasion to exploit grief, crisis, age, or isolation?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: low
    quick_win: true
    steps:
      - State in policy that AI-assisted appeals may not target vulnerability.
      - Add a review step for AI-drafted appeals, including the segments they target.
    evidence: [Policy text, Review records]

  - id: L4.11
    layer: L4
    floor: true
    floor_principle: "Protecting the vulnerable is the provider's burden and cannot be weakened."
    title: Protections are on by default and can only be raised
    question: Do protections for vulnerable people ship enabled, and can an administrator only strengthen them, never weaken them?
    audience: [product]
    max_guarantee: structural
    severity: high
    effort: medium
    quick_win: false
    steps:
      - Ship the protected-persons rules switched on.
      - Make them non-waivable at the customer or chapter level. Allow tightening only.
      - Do not shift the burden of control onto the families or administrators who might not find the setting.
    evidence: [Default configuration, Admin settings showing no weaken option]

  - id: L4.12
    layer: L4
    floor: true
    floor_principle: "A person's worth is never scored by what they produce."
    title: A person's worth is never scored by usefulness
    question: Do you make sure that no AI score, ranking, or recommendation treats a person's worth or deservingness as depending on what they produce, achieve, or contribute (for example productivity, capacity, age, or ability)?
    audience: [organization, product]
    max_guarantee: procedural
    severity: critical
    effort: medium
    quick_win: false
    steps:
      - List every AI score, ranking, or prioritization that applies to people.
      - "Review each measure. Prioritizing by need is fine; treating output, ability, age, or usefulness as a person's worth is not. Remove or change any measure that does."
      - Require a named person to sign off on each measure, and re-review when the model or its inputs change.
    evidence: [List of AI scoring uses with review notes, Sign-off record]

  # ------------------------------------------------------------------ L5 Mission
  - id: L5.01
    layer: L5
    title: Mission and commitments are written down for AI
    question: Have you written down your mission, firm commitments, and red lines in a form that an AI can be given and a person can audit?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: low
    quick_win: true
    steps:
      - "Write a short values file: what you stand for, what you never do, and what is left to judgment."
      - For each commitment, say how firmly it is held (firm, flexible, or open).
      - Have your leadership approve it.
    evidence: [Values file, Approval record]

  - id: L5.02
    layer: L5
    title: Values file is given to the AI as context
    question: Is that values file loaded as context for the AI systems in scope?
    audience: [organization, product]
    max_guarantee: guided
    severity: medium
    effort: low
    quick_win: true
    steps:
      - Load the values file into the AI's instructions for each approved use case.
      - Be honest that this is guidance. The AI usually follows it, and nothing ensures it.
    evidence: [Configuration showing the loaded file]

  - id: L5.03
    layer: L5
    title: Enforced commitments are separated from guidance
    question: Can you show which of your commitments are enforced by a gate or a person, and which are guidance only?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: medium
    quick_win: false
    steps:
      - Mark each commitment as enforced in code, enforced by a person, or guidance only.
      - Compile only firm commitments that a machine can check into rules. Flexible ones become at most a review flag, and open ones are never turned into rules.
      - Show the result to leadership and reviewers.
    evidence: [Enforced-versus-guided table]

  - id: L5.04
    layer: L5
    title: Your values are authored by you
    question: Were your values written and approved by your own governance, rather than supplied as a default by a vendor or developer?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: low
    quick_win: true
    steps:
      - Have your board or leadership adopt the values through your normal process.
      - If you build software, set floors only for safeguarding and data protection. Never ship values or doctrine as a default.
    evidence: [Adoption record]

  - id: L5.05
    layer: L5
    title: Claims are sourced and estimates are marked
    question: Must AI-drafted content that states facts or speaks for your organization cite sources and mark estimates, with unsourced claims flagged for a reviewer?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: medium
    quick_win: false
    steps:
      - Require a source for factual claims and for statements about your own positions.
      - Mark estimates and uncertainty explicitly in drafts.
      - Hold, and do not block, content with unsourced claims, so a reviewer can decide.
    evidence: [Review checklist, Examples of flagged drafts]

  - id: L5.06
    layer: L5
    title: Open questions are marked as opinion
    question: When a question is genuinely contested or your organization has no settled position, does the AI say so and mark its answer as opinion?
    audience: [organization, product]
    max_guarantee: guided
    severity: medium
    effort: low
    quick_win: true
    steps:
      - List the questions where your organization deliberately holds no position.
      - Tell the AI to present them as open and to avoid taking sides in your name.
      - Do not block content for taking a side. Check only that it is marked as opinion.
    evidence: [List of open questions, Sample outputs]

  - id: L5.07
    layer: L5
    title: Behavioral regression tests
    question: Do you run a repeatable set of test questions, seeded from your values and from known drift, whenever a model or prompt changes?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: medium
    quick_win: false
    steps:
      - Write 20 to 50 test prompts that probe your red lines and the ways AI tends to drift from your values.
      - Record expected and unacceptable answers. Have a person judge the results.
      - Re-run on every model, prompt, or values-file change and keep the results.
    evidence: [Test set, Dated test results]

  - id: L5.08
    layer: L5
    title: Public-facing AI content is reviewed before release
    question: Is AI-drafted content that goes out in your name (publications, appeals, donor communications, public statements) reviewed by a person before release?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: low
    quick_win: true
    steps:
      - Define which outputs count as public-facing.
      - Require a named reviewer's approval before release.
      - Track how often reviewers change or reject drafts.
    evidence: [Review log]

  - id: L5.09
    layer: L5
    title: Corrections can come from below
    question: Is there a channel for staff, chapters, or the community to challenge or propose changes to the AI's rules, rather than only inheriting them?
    audience: [organization, product]
    max_guarantee: procedural
    severity: medium
    effort: low
    quick_win: true
    steps:
      - Publish how to suggest a change to the AI rules.
      - Review proposals on a schedule and record the outcome.
    evidence: [Proposal channel, Record of decisions]

  - id: L5.10
    layer: L5
    title: The governing values source is pinned and versioned
    question: Is the document that governs your AI's values and commitments kept at a fixed, dated version, and does changing it require a recorded decision by a named person?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: low
    quick_win: true
    steps:
      - Name the document or documents that govern what the AI is told about your values and commitments.
      - Give each a version number and date, and store it somewhere that tracks changes.
      - Require a named approver for any change, and record the date, the reason, and the approver.
      - Test the AI's behavior against a new version before it goes live (see L5.07).
    evidence: [Versioned values document, Change records with approver]

  # ------------------------------------------------------------------ L6 Human boundary
  - id: L6.01
    layer: L6
    title: No signing as a person without their approval
    question: Is it impossible for the AI to send something signed as a named staff member, leader, or professional unless that person approved this specific message?
    audience: [organization, product]
    max_guarantee: structural
    severity: critical
    effort: medium
    quick_win: false
    steps:
      - Check sender identity and signature block on every outbound message.
      - Hold messages that carry a person's name or signature without that person's approval of the specific message.
    evidence: [Send rule, Test messages]

  - id: L6.02
    layer: L6
    floor: true
    floor_principle: "The AI never passes as a person."
    title: AI is disclosed where it matters
    question: Do public-facing chatbots identify themselves as AI, and is AI-drafted content labeled wherever your policy or the law requires?
    audience: [organization, product]
    max_guarantee: structural
    severity: high
    effort: low
    quick_win: true
    steps:
      - Have every chatbot state at the start that it is an AI.
      - Add a configurable disclosure line or metadata to AI-assisted messages.
      - Check disclosure rules that apply to you (verify with legal advice).
    evidence: [Chatbot opening message, Message footers]

  - id: L6.03
    layer: L6
    floor: true
    floor_principle: "Simulated care is never presented as a real relationship."
    title: No simulated care, friendship, or companionship
    question: Do you avoid member-facing AI that simulates care or companionship, and are care messages sent and followed up by a named person?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: low
    quick_win: true
    steps:
      - "State the rule: the AI drafts, and a person cares."
      - Require a human sender for care and support messages.
      - Pay special attention to isolated, grieving, and dependent people, who are most at risk of mistaking simulation for relationship.
    evidence: [Policy, Care messaging workflow]

  - id: L6.04
    layer: L6
    title: Roles that need a human route to one
    question: Do requests for counseling, clinical, legal, or other professional judgment route to a qualified person rather than being answered by the AI?
    audience: [organization, product]
    max_guarantee: procedural
    severity: critical
    effort: medium
    quick_win: false
    steps:
      - List roles in your organization that require a qualified human.
      - Detect requests for those roles and route them to a named person.
      - Tell the user plainly that a person will handle it.
    evidence: [Role list, Routing rule, Test results]

  - id: L6.05
    layer: L6
    title: Confidential disclosures are never solicited or recorded by AI
    question: Is AI prevented from soliciting, recording in records, or sending confidential or privileged disclosures (counseling, legal, medical, or similar)?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: medium
    quick_win: false
    steps:
      - Define what counts as confidential or privileged in your work.
      - Add content rules on writes and sends that hold and route such content to a person.
    evidence: [Content rule, Test results]

  - id: L6.06
    layer: L6
    title: "Positive scope: what the AI is for"
    question: Have you written down what the AI is for, so that a refusal can come with a helpful alternative?
    audience: [organization, product]
    max_guarantee: guided
    severity: medium
    effort: low
    quick_win: true
    steps:
      - For each boundary, write what the AI can still legitimately help with.
      - Include these in the AI's instructions.
    evidence: [Scope statement]

  - id: L6.07
    layer: L6
    title: Guarding against over-reliance
    question: Do you monitor whether staff accept AI output without scrutiny, and take steps to keep human judgment strong?
    audience: [organization]
    max_guarantee: procedural
    severity: medium
    effort: medium
    quick_win: false
    steps:
      - Track how often reviewers edit or reject AI drafts. A rate near zero is a warning sign.
      - Rotate reviewers and sample approved items for second review.
    evidence: [Edit and reject metrics, Sampling records]

  - id: L6.08
    layer: L6
    title: A human is always reachable
    question: Can anyone using a public-facing AI reach a person easily?
    audience: [organization, product]
    max_guarantee: structural
    severity: high
    effort: low
    quick_win: true
    steps:
      - Put a visible way to reach a person in every AI interface.
      - Staff the channel, and measure response time.
    evidence: [Interface screenshots, Response time metrics]

  # ------------------------------------------------------------------ L7 Accountability
  - id: L7.01
    layer: L7
    title: Named owner for AI
    question: Is there a named executive owner for AI use, and a group or role that reviews it?
    audience: [organization, product]
    max_guarantee: procedural
    severity: critical
    effort: low
    quick_win: true
    steps:
      - Name one accountable executive.
      - Set up a small review group (operations, programs, safeguarding, technology, and a board liaison).
      - Report to the board or equivalent at least twice a year.
    evidence: [Role description, Meeting minutes]

  - id: L7.02
    layer: L7
    title: Approved AI use policy
    question: Do you have a short AI use policy that leadership approved and staff received?
    audience: [organization]
    max_guarantee: guided
    severity: high
    effort: low
    quick_win: true
    steps:
      - Write a policy covering approved tools, forbidden uses, data rules, and where to ask questions.
      - Have leadership approve it, publish it, and cover it in onboarding.
    evidence: [Policy, Acknowledgement records]

  - id: L7.03
    layer: L7
    title: Register of AI systems and use cases
    question: Do you keep a current list of AI systems and use cases, each with a risk rating?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: low
    quick_win: true
    steps:
      - List every AI tool and use case, including features built into software you already use.
      - Rate each by what it touches (see L1.01) and what it can do (see L3).
      - Review the list at least every six months.
    evidence: [AI register]

  - id: L7.04
    layer: L7
    floor: true
    floor_principle: "Someone identifiable answers for the AI at every stage."
    title: Responsibility map
    question: For each deployment, is it written down what the vendor, the software provider, and your organization each answer for?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: low
    quick_win: true
    steps:
      - For each AI deployment, write who is responsible for the model, the integration, the data, the configuration, and the decisions.
      - Share it with leadership and, where relevant, with the people affected.
    evidence: [Responsibility map]

  - id: L7.05
    layer: L7
    title: Audit log of AI activity
    question: Does a log record who used which AI tool, with what inputs and actions, and what the outcome was?
    audience: [organization, product]
    max_guarantee: structural
    severity: critical
    effort: medium
    quick_win: false
    steps:
      - Log user, time, tool, parameters, and outcome for every AI action.
      - Protect the log from alteration, and limit who can read it.
      - Keep personal data out of the log where possible.
    evidence: [Sample log entries, Log retention settings]

  - id: L7.06
    layer: L7
    title: Log records authority, not only activity
    question: Do your logs show who granted the permission, under which policy version, whether a person overrode a decision, and whether the AI escalated or delegated?
    audience: [organization, product]
    max_guarantee: structural
    severity: high
    effort: medium
    quick_win: false
    steps:
      - Add grant, signer, policy version, override, and escalation-or-delegation fields to the log schema.
      - Test that a reviewer can reconstruct why an action was allowed.
    evidence: [Log schema, Reconstruction test]

  - id: L7.07
    layer: L7
    title: Kill switch
    question: Can an administrator switch AI access off immediately, for one user, one tool, or everything?
    audience: [organization, product]
    max_guarantee: structural
    severity: critical
    effort: low
    quick_win: true
    steps:
      - Identify the single place where AI access can be cut off.
      - Name two people who can use it, and write down how.
      - Practice it once.
    evidence: [Runbook, Test record]

  - id: L7.08
    layer: L7
    title: AI incident response
    question: Do you have a plan for AI incidents (data exposure, harmful message, wrong action), including who is told and how you learn from it?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: medium
    quick_win: false
    steps:
      - Add AI scenarios to your existing incident plan.
      - Define who decides, who is notified (including regulators, funders, and affected people where required), and how lessons are recorded.
      - Run a tabletop exercise once a year.
    evidence: [Incident plan, Exercise notes]

  - id: L7.09
    layer: L7
    floor: true
    floor_principle: "Anyone affected can appeal to a human."
    title: Recourse for affected people
    question: Can a person affected by an AI-informed decision ask for review by a human, and can staff reconstruct how the decision was reached?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: medium
    quick_win: false
    steps:
      - Tell affected people how to ask for a human review.
      - Make sure the log (see L7.05, L7.06) lets staff reconstruct the decision.
      - Record the outcome of each review.
    evidence: [Published recourse process, Sample review record]

  - id: L7.10
    layer: L7
    title: Impact assessment before higher-risk use
    question: Before enabling write, send, or decision-support uses, do you complete a short assessment of impact on people, especially the most vulnerable?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: low
    quick_win: true
    steps:
      - "Use a one-page checklist: who is affected, what could go wrong, what safeguards exist, who signs."
      - Include the voice of the people affected, or those who represent them.
      - Attach it to the grant record (see L3.05).
    evidence: [Completed assessments]

  - id: L7.11
    layer: L7
    title: Staff AI literacy
    question: Have staff and volunteers who use AI been taught what it can and cannot do, and how to spot errors?
    audience: [organization]
    max_guarantee: guided
    severity: medium
    effort: low
    quick_win: true
    steps:
      - Run a short session (one hour) on hallucination, bias, privacy, and the limits of the AI.
      - Repeat for new staff, and refresh when tools change.
    evidence: [Training materials, Attendance]

  - id: L7.12
    layer: L7
    title: Claims discipline
    question: Do you check that nothing you tell supporters, funders, or constituents about AI safety describes a guided control as if it were enforced?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: low
    quick_win: true
    steps:
      - Before publishing a safety claim, find the control behind it and check its guarantee type.
      - Say enforced only for structural controls. Say recommended or guided for the rest.
      - Do not describe roadmap items in the present tense.
    evidence: [Claims review record]

  - id: L7.13
    layer: L7
    title: Red-team testing
    question: Do you test your safeguards with deliberate attempts to break them, including instructions hidden in documents?
    audience: [organization, product]
    max_guarantee: procedural
    severity: high
    effort: high
    quick_win: false
    steps:
      - Seed known violations (a message to a minor, a hidden instruction in an upload, an attempt to read a blocked record).
      - Confirm each is caught. Keep the results as a regression suite.
      - Re-run on every material change.
    evidence: [Red-team test set, Results]

  - id: L7.14
    layer: L7
    title: Change control and review rhythm
    question: Are your AI policies versioned, and are they reviewed on a regular schedule and whenever something material changes?
    audience: [organization, product]
    max_guarantee: procedural
    severity: medium
    effort: low
    quick_win: true
    steps:
      - Give every policy and rule set a version number and date.
      - Review at least annually, and on any material change of model, vendor, or use.
      - Changes to firm commitments trigger re-testing and sign-off.
    evidence: [Version history, Review minutes]

  - id: L7.15
    layer: L7
    title: Policy inheritance across chapters or affiliates
    question: If you have chapters, affiliates, or customers, can a parent set rules that the others inherit and can tighten but not weaken?
    audience: [organization, product]
    max_guarantee: structural
    severity: medium
    effort: high
    quick_win: false
    steps:
      - Define which rules are set centrally and which are local.
      - Let local units tighten central rules, never loosen them.
      - Let local units propose changes to the center (see L5.09).
    evidence: [Policy hierarchy, Configuration]
