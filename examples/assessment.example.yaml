# safeAI assessment
#
# For each control below, set `answer:` to one of:
#   structural   enforced in code or configuration; it cannot happen whatever the AI does
#   procedural   it cannot happen without a named person's approval or a recorded process
#   guided       people or the AI are told what to do; nothing ensures it
#   none         no control exists yet
#   na           does not apply to you (explain in `note`)
# Leave `answer:` blank for controls you have not assessed yet.
#
# Be honest rather than flattering. "guided" is a perfectly good answer: it tells you
# where to improve. Use `evidence:` to name something a reviewer could look at.

safeai_assessment: 1
framework_version: "0.1.0"
scope:
  name: "Example Community Services (fictional)"            # the organization, system, or product being assessed
  mode: both                # organization | product | both
  assessor: "Example assessor"
  date: "2026-01-15"
  description: "A fictional mid-sized service non-profit with a CRM, a staff chatbot, and an AI drafting tool. Illustrative only."
answers:

  # ======================================================================
  # Level 1: Data protection (SEE)
  # Your people's data stays protected.
  # ======================================================================

  # Data inventory and classification  [high; strongest possible: procedural]
  #   Do you know which data the AI systems in scope can reach, and is that data
  #   classified by sensitivity?
  L1.01:
    answer: procedural
    note: "Data register kept by operations."
    evidence: "data-register.xlsx"

  # AI inherits the user's own permissions  [critical; strongest possible: structural]
  #   Does the AI act with the signed-in person's own access rights, so it can never see
  #   more than that person can?
  L1.02:
    answer: structural
    note: "Chatbot connects through each user's own sign-in."
    evidence: "SSO config; tested with low-privilege user"

  # Restricted data is blocked from AI paths by default  [critical; strongest possible: structural]
  #   Are your most sensitive data sets (credentials, payment details, case files)
  #   technically unreachable by the AI unless someone deliberately opens them?
  L1.03:
    answer: structural
    note: "Payment and credential tables blocked."
    evidence: "block-list.yaml"

  # Personal data is masked before it reaches the model  [critical; strongest possible: structural]
  #   Are sensitive fields (email, phone, birth date, ID numbers, addresses) masked or
  #   removed in code before the AI receives them?
  L1.04:
    answer: guided
    note: "We ask staff to avoid personal details but nothing masks them."
    evidence: ""

  # Personal data inside free text is detected  [high; strongest possible: structural]
  #   Do you detect and mask personal data typed into notes, comments, or message fields,
  #   not only data in labeled fields?
  L1.05:
    answer: none
    note: ""
    evidence: ""

  # Staff know what not to paste into AI tools  [high; strongest possible: guided]
  #   Do staff and volunteers have clear, short guidance on what data must never be typed
  #   or pasted into an AI tool?
  L1.06:
    answer: guided
    note: "One-page guidance in onboarding."
    evidence: "onboarding-pack.pdf"

  # Pass-through handling and minimal retention  [high; strongest possible: structural]
  #   Do your AI integrations avoid storing constituent records, and do they keep prompts,
  #   outputs, and logs only as long as needed?
  L1.07:
    answer: procedural
    note: "Retention reviewed once; no automatic deletion yet."
    evidence: ""

  # Privacy obligations cover AI use  [high; strongest possible: procedural]
