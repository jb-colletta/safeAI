[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "safeai-toolkit"
version = "0.1.0"
description = "Assess gaps in safe AI use and take steps to close them. Free and open source, for any non-profit."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["PyYAML>=5.4"]
keywords = ["ai-safety", "nonprofit", "governance", "risk-assessment"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
safeai = "safeai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
safeai = ["data/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
